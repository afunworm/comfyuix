<div class="backdrop" data-open="true" style="background: var(--bg)">
	<div class="dialog" style="width: min(460px, 100%)">
		<div class="dialog__head">
			<h2 class="dialog__title">Reset Password</h2>
		</div>

		@if (done) {
			<div class="dialog__body">
				<p class="dialog__msg">
					Your password has been updated. You can now sign in with your new password.
				</p>
			</div>
			<div class="dialog__foot">
				<button class="btn btn--primary" (click)="goToLogin()">
					Go to Sign In
				</button>
			</div>
		} @else {
			<div class="dialog__body">
				<div class="field">
					<label class="label" for="new-password">New Password</label>
					<input
						id="new-password"
						class="control"
						type="password"
						[(ngModel)]="newPassword"
						(keydown.enter)="confirmField.focus()"
						[disabled]="!!error && !newPassword"
					/>
				</div>
				<div class="field">
					<label class="label" for="confirm-password">Confirm Password</label>
					<input
						#confirmField
						id="confirm-password"
						class="control"
						type="password"
						[(ngModel)]="confirmPassword"
						(keydown.enter)="submit()"
					/>
				</div>
			</div>

			@if (error) {
				<div style="padding: 0 14px">
					<div class="inset" style="padding: 10px 12px; color: var(--danger)">
						{{ error }}
					</div>
				</div>
			}

			<div class="dialog__foot">
				<button
					class="btn btn--primary"
					[disabled]="loading || !newPassword || !confirmPassword || !token"
					(click)="submit()"
				>
					{{ loading ? "Saving…" : "Set New Password" }}
				</button>
			</div>
		}
	</div>
</div>
