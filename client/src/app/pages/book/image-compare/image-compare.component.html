<div
  class="compare-wrap"
  #compareWrap
  [style.transform]="'translate(' + panX() + 'px, ' + panY() + 'px) scale(' + zoom() + ')'"
>
  <!-- After image (result) — always full -->
  <img
    class="img"
    [src]="afterURL()"
    [alt]="altText()"
  />
  <!-- Before image — clipped to left of split -->
  <img
    class="img img--before"
    [src]="beforeURL()"
    alt="Before"
    [style.clip-path]="'inset(0 ' + (100 - split()) + '% 0 0)'"
  />
  <!-- Before / After labels -->
  <div class="compare-label compare-label--before">Before</div>
  <div class="compare-label compare-label--after">After</div>
  <!-- Divider -->
  <div
    class="divider"
    [style.left.%]="split()"
    (pointerdown)="startCompareDrag($event)"
  >
    <div class="divider-line"></div>
    <div class="divider-handle">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="14"
        height="14"
      >
        <polyline points="15 18 9 12 15 6" />
        <polyline points="9 18 3 12 9 6" style="display: none" />
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="9 6 15 12 9 18" style="display: none" />
      </svg>
    </div>
  </div>
</div>
